<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інформація для гравців</title>
    <style>
        /* Тут налаштовується зовнішній вигляд сайту */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #1e1e24; /* Темний приємний фон */
            color: #f0f0f5; /* Світлий текст */
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 {
            color: #4caf50; /* Зелений колір для головного заголовка */
            border-bottom: 2px solid #4caf50;
            padding-bottom: 10px;
        }
        h2 {
            color: #81c784; /* Світліший зелений для підзаголовків */
            margin-top: 30px;
        }
        .important {
            background-color: #2d2d35;
            border-left: 5px solid #ff9800; /* Помаранчева лінія для важливого */
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
    </style>
</head>
